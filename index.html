<h1>방아쇠의 무게</h1>
<div id="st" aria-live="polite"></div>
<canvas id="cv" width="320" height="180"></canvas>
<div id="cap"></div>
<div id="rules"><b>규칙</b> 장면마다 제한 시간 안에 <b>마우스로 조준해 표적 위에서 클릭(또는 Space)</b>하면 살아남지만 처형자가 됩니다. <b>거부(N)</b>하거나 시간이 다 되면 당신이 죽습니다. 결과는 세 가지입니다. <b>승리</b> = 한 명도 쏘지 않고 죽음. <b>사망</b> = 일부를 쏘고 중간에 죽음. <b>사망(결말 도달)</b> = 네 명을 쏘고 마지막 장면까지 가서 죽음.</div>
<div class="row">
<button id="bf">발사 (Space)</button><button id="bn">쏘지 않는다 (N)</button><button id="bp">일시정지/재개 (P)</button><button id="br">시작·다시 시작 (R)</button><button id="bl">기록 보기</button>
</div>
<div class="row">
<label>제한 시간(난이도) <select id="lim"><option>4</option><option>6</option><option>8</option><option>10</option></select>초 <small>(다음 판부터)</small></label>

</div>

function showLog(){const L=sv.log;let h='';
 [4,6,8,10].forEach(l=>{const g=L.filter(o=>o.lim===l);if(!g.length)return;const k=g.map(o=>o.k),n=c=>g.filter(o=>o.c===c).length;
  h+=`<p><b>제한 ${l}초</b> ${g.length}회 · 처형 ${Math.min(...k)}~${Math.max(...k)}명(중앙 ${med(k)}) · 플레이 시간 중앙 ${(med(g.map(o=>o.ms))/1000).toFixed(1)}초 · 결말 ${n('clear')} / 거부 ${n('refuse')} / 망설임 ${n('timeout')}</p>`});
 if(L.length)h+='<table><tr><th>#<th>제한(초)<th>처형<th>시간(초)<th>끝난 원인<th>평균 반응(ms)</tr>'+L.slice(-20).map((o,i)=>`<tr><td>${L.length-Math.min(20,L.length)+i+1}<td>${o.lim}<td>${o.k}<td>${(o.ms/1000).toFixed(1)}<td>${CN[o.c]||'?'}<td>${o.avg}</tr>`).join('')+'</table>';
 $('log').innerHTML=h||'아직 기록이 없습니다. 한 판을 끝내면 여기에 자동 저장됩니다.';$('bl').textContent=`기록 보기 (${L.length}판 저장됨)`}
function sync(){$('lim').value=sv.lim;$('mu').checked=sv.mute;$('rd').checked=sv.red;$('note').textContent=note}
let byMouse=false;
addEventListener('pointerdown',()=>{byMouse=true},true);
addEventListener('keydown',e=>{byMouse=false;if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const c=e.code,tg=e.target&&e.target.tagName;
 if(c==='Space'){if(tg==='INPUT'||tg==='SELECT')return;e.preventDefault();fire()}else if(c==='KeyN')refuse();else if(c==='KeyP')tog();else if(c==='KeyR'){e.preventDefault();newRun()}});
addEventListener('keyup',e=>{const tg=e.target&&e.target.tagName;if(e.code==='Space'&&tg!=='INPUT'&&tg!=='SELECT'&&!e.ctrlKey&&!e.metaKey&&!e.altKey)e.preventDefault()});
addEventListener('blur',autoP);
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoP()});
const bt=(id,f)=>$(id).addEventListener('click',function(){f();this.blur()});
bt('bf',fire);bt('bn',refuse);bt('bp',tog);bt('br',newRun);
bt('bl',()=>{const d=$('dl');d.open=!d.open;if(d.open)d.scrollIntoView({block:'center'})});
bt('bz',()=>{try{localStorage.removeItem(KEY)}catch(e){}sv=def();note='저장을 초기화했습니다. 기본값으로 시작합니다.';sync();showLog();fresh('title')});
C.addEventListener('pointermove',e=>{const r=C.getBoundingClientRect();S.ax=Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width));S.ay=Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))});
C.addEventListener('click',e=>{if(S.ph==='title'){newRun();return}const r=C.getBoundingClientRect();S.ax=(e.clientX-r.left)*W/r.width;S.ay=(e.clientY-r.top)*H/r.height;fire()});
const done=e=>{if(byMouse)e.target.blur()};
$('lim').addEventListener('change',e=>{sv.lim=+e.target.value;save();done(e)});
$('mu').addEventListener('change',e=>{sv.mute=e.target.checked;save();done(e)});
$('rd').addEventListener('change',e=>{sv.red=e.target.checked;if(sv.red)S.fx=0;save();done(e)});
fresh('title');sync();showLog();requestAnimationFrame(tick);
})();
</script></body></html>
